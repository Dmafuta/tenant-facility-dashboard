services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Enable pg_stat_statements for query performance analysis
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c pg_stat_statements.max=10000
    environment:
      POSTGRES_DB:       facilityapp_v3
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PgBouncer (connection pooler) ────────────────────────────────────────────
  pgbouncer:
    image: bitnami/pgbouncer:1.23.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST:              postgres
      POSTGRESQL_PORT:              5432
      POSTGRESQL_DATABASE:          facilityapp_v3
      POSTGRESQL_USERNAME:          ${DB_USERNAME}
      POSTGRESQL_PASSWORD:          ${DB_PASSWORD}
      PGBOUNCER_POOL_MODE:          transaction
      PGBOUNCER_MAX_CLIENT_CONN:    200
      PGBOUNCER_DEFAULT_POOL_SIZE:  10
      PGBOUNCER_SERVER_RESET_QUERY: ""
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${DB_USERNAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot API ──────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/dmafuta/tenant-facility-api:latest
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL:              jdbc:postgresql://pgbouncer:5432/facilityapp_v3?prepareThreshold=0
      DB_USERNAME:         ${DB_USERNAME}
      DB_PASSWORD:         ${DB_PASSWORD}
      JWT_SECRET:          ${JWT_SECRET}
      FRONTEND_URL:        ${FRONTEND_URL}
      SEED_ADMIN_EMAIL:    ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      REDIS_HOST:          redis
      REDIS_PORT:          6379
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://dashboard.greatwallgardens.estate,https://meter.greatwallgardens.estate}
      TENANT_ID:           ${TENANT_ID:-great-wall-gardens}
    expose:
      - "8081"

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/dmafuta/tenant-portal:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8081
      NODE_ENV:    production
    volumes:
      - ./private/templates:/app/private/templates:ro
    expose:
      - "3000"

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro

  # ── Certbot (Let's Encrypt) ───────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  pgdata:
  redisdata:
  certbot-www:
  certbot-certs:
